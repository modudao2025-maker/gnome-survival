async function reviveUI(err){const tok=++revTok,d=modal(L('기체 신호 소실','Flight signal lost'),L('긴급 재출격권 · G로 이어하기','Emergency revive · continue with G'));
  const info=document.createElement('p'),st=document.createElement('p');d.append(info,st);if(err)st.textContent='⚠ '+shopErr(err);
  const end=()=>{if(tok!==revTok)return;revTok++;R.noRevive=true;close();finish(false)};
  if(!acct.addr||!shopRealm()){info.innerHTML=`${L('G로 이어하기 · 남은 횟수','Continue with G · left')} 2/2 · ${L('가격','price')} ${fmtG(REVIVE_UG)}<br><small>${L('지갑을 연결한 계정 잔액으로만 쓸 수 있습니다. 가격·차감·횟수는 realm이 정합니다.','Uses the connected account balance only. Price, charge and count are set by the realm.')} ${!shopRealm()?shopErr('NO_REALM'):''}</small>`;button(d,L('게임 종료','End flight'),end,'go');return}
  info.textContent=L('realm에서 남은 횟수와 차감 내역 확인 중…','Checking remaining revives and charge on realm…');const endB=button(d,L('게임 종료','End flight'),end);
  let used,q;try{[used,q]=await Promise.all([qeval(`RevivesUsed(${qs(acct.addr)},${qs(R.runId)})`).then(asInt),quoteOf('revive')])}
  catch(e){if(tok!==revTok)return;info.textContent='⚠ '+L('조회 실패','Query failed')+' — '+shopErr(e);button(d,L('다시 조회','Retry'),()=>reviveUI());return}
  if(tok!==revTok||mode!=='revive')return;const left=Math.max(0,REVIVE_MAX-used);
  info.innerHTML=`<b>${L('G로 이어하기 · 남은 횟수','Continue with G · left')} ${left}/${REVIVE_MAX}</b><br>${breakdownHTML(q,L('긴급 재출격 1회','One emergency revive'))}<br><small>${L('사용하면 이 출격은 경쟁 순위·최고 기록에서 제외됩니다.','Using it excludes this flight from competitive best records.')}</small>`;
  const go=button(d,L(`${fmtG(q.price)}로 이어하기 (${left}/${REVIVE_MAX})`,`Continue for ${fmtG(q.price)} (${left}/${REVIVE_MAX})`),async()=>{if(shopBusy||tok!==revTok)return;shopBusy=true;go.disabled=endB.disabled=true;st.textContent=L('지갑 승인 대기…','Waiting for wallet approval…');
    try{await shopTx('UseRevive',[R.runId]);const u2=await qeval(`RevivesUsed(${qs(acct.addr)},${qs(R.runId)})`).then(asInt);if(u2<=used)throw Error('NOT_CONFIRMED');shopBusy=false;if(tok===revTok)doRevive(u2)}
    catch(e){shopBusy=false;if(tok===revTok&&mode==='revive')reviveUI(e)}},'go');
  go.disabled=left<=0||!q.ok;if(left<=0)st.textContent=L('이 출격의 재출격권을 모두 사용했습니다 (0/2).','No revives left for this flight (0/2).')}
function doRevive(used){revTok++;close();const r=R,p=r.p;r.revived=true;r.reviveCount=used;p.hp=p.max;p.inv=4;r.haz=[];r.marks=[];
  for(const e of r.foes)if(!e.b&&!e.legend&&distance(e,p)<230){const a=Math.atan2(e.y-p.y,e.x-p.x);e.x=p.x+Math.cos(a)*480;e.y=p.y+Math.sin(a)*480}
  mode='play';warn(`긴급 재출격 (${REVIVE_MAX-used}/${REVIVE_MAX} 남음)`,`Emergency revive (${REVIVE_MAX-used}/${REVIVE_MAX} left)`);stamp();ui()}
try{if(localStorage.getItem('gnome.rift.wallet')==='adena')setTimeout(async()=>{if(!window.adena)return;await walletConnect(true);if(acct.addr){await shopRefresh();if(mode==='home')home()}},300)}catch{}
/* ===== END G v2 ===== */

/* ===== 장비 선택·교체 : 보물상자 장비 보상도 레벨업처럼 카드에서 선택 / 슬롯이 가득 차면 같은 종류만 교체 =====
   - 이미 가진 장비 → 슬롯과 무관하게 레벨업. 최대 레벨은 후보 제외.
   - 새 장비는 슬롯이 가득 차도 후보에 남김(교체 가능). 확정 전에는 아무것도 지우거나 소모하지 않음.
   - 버린 장비는 그 출격에서 Lv0으로 초기화 → 다시 얻으면 Lv1 (이전 레벨·진화 복원 없음).
   - 진화는 기존 무기 자리를 쓰므로 교체를 묻지 않음. 기체 전용 무기는 기존처럼 다른 경로로 얻을 수 없어 버리기 불가. */
const EXCL=i=>i>=28;
const eul=n=>'을를을을를를을을을를'[n%10]; // Lv 숫자 발음에 맞는 조사 (Lv7을, Lv2를) // 기체 전용 무기(28~31)와 그 진화(32~35)
function equipCands(source){const out=[],ws=slot(WPN)+slot(EVO),as=slot(ACC);
  for(let i=0;i<R.lv.length;i++){const v=R.lv[i];if(i===PHX&&R.phxSpent)continue;
    if(v>0){if(v<maxLv(i))out.push({i,from:v,to:v+1,isNew:false,full:false});continue}
    if(EXCL(i))continue;
    if(isAcc(i)){if(source!=='draft')out.push({i,from:0,to:1,isNew:true,full:as>=5});continue} // 새 액세서리는 기존 규칙대로 지도·상자에서만
    if(WPN.includes(i)&&!R.lv[EVO[WPN.indexOf(i)]]&&(source!=='draft'||!MAPONLY.includes(i)))out.push({i,from:0,to:1,isNew:true,full:ws>=5})}
  return out}
function equipCard(parent,i,fn,source){const c=equipCands(source||'draft').find(x=>x.i===i),v=R.lv[i];
  const lvTxt=c&&c.isNew?L('신규 · Lv1','New · Lv1'):`Lv${v} → Lv${v+1}`,kind=isAcc(i)?L('액세서리','Accessory'):L('무기','Weapon');
  return card(parent,i,`${nm(names[i])} · ${lvTxt}`,`${kind} · ${nm(desc[i])}`+(c&&c.full?' · '+L('슬롯 가득: 고르면 교체할 장비를 선택','Slots full: choose one to replace'):''),fn)}
let equipTok=0;
/* 교체할 장비 고르기 → 확인 → 교체. back()은 같은 후보 화면으로 돌아감 */
function replaceFlow(newId,back,apply){const tok=++equipTok,isA=isAcc(newId),list=(isA?ACC:[...WPN,...EVO]).filter(i=>R.lv[i]>0);
  const d=modal(isA?L('버릴 액세서리를 선택하세요','Choose an accessory to drop'):L('버릴 무기를 선택하세요','Choose a weapon to drop'),
    L(`${nm(names[newId])} Lv1을 장착하려면 ${isA?'액세서리':'무기'} 하나를 버려야 합니다. 버린 장비는 다시 얻어도 Lv1부터 시작합니다.`,`To equip ${nm(names[newId])} Lv1, drop one ${isA?'accessory':'weapon'}. Dropped gear restarts at Lv1 if found again.`));
  const st=document.createElement('div');st.className='vertical';d.append(st);
  for(const i of list){const b=card(st,i,`${nm(names[i])} Lv${R.lv[i]}`,EXCL(i)?L('기체 전용 무기 · 다른 방법으로 다시 얻을 수 없어 버릴 수 없음','Hull-exclusive weapon · cannot be dropped (no other way to get it back)'):(isA?L('액세서리','Accessory'):L('무기','Weapon')),()=>{if(tok!==equipTok)return;confirmDrop(i)});b.disabled=EXCL(i)}
  button(d,L('다시 고르기','Choose again'),()=>{if(tok===equipTok){equipTok++;back()}});
  function confirmDrop(i){const t2=++equipTok,c=modal(L('장비 교체','Replace gear'),L(`${nm(names[i])} Lv${R.lv[i]}${eul(R.lv[i])} 버리고 ${nm(names[newId])} Lv1을 장착할까요?`,`Drop ${nm(names[i])} Lv${R.lv[i]} and equip ${nm(names[newId])} Lv1?`));
    button(c,L('교체하기','Replace'),()=>{if(t2!==equipTok)return;equipTok++;apply(i)},'go');button(c,L('다시 고르기','Choose again'),()=>{if(t2===equipTok){equipTok++;back()}})}}
function dropGear(i){R.lv[i]=0;if(i===PHX)R.charges=0} // 그 출격의 장비 상태만 초기화 (영구 해금·도감·구매 기록은 그대로)
/* 레벨업 카드 선택 */
function pick(i){if(!R.choice||mode!=='pick')return;const c=equipCands('draft').find(x=>x.i===i);if(!c)return;
  const done=drop=>{if(!R.choice)return;if(drop!=null)dropGear(drop);if(!grant(i)){if(drop!=null)R.notice='?';return}R.offers=null;R.choice=false;close();mode='play';play('Weapon_Level_Up',.4,.1)||sfx('pick');stamp();ui()};
  if(c.isNew&&c.full)replaceFlow(i,()=>upgrade(),done);else done(null)}
/* 보물상자 장비 보상: 최대 3개 후보 중 선택 */
function chestEquip(){mode='chest';R.chest=true;const cands=equipCands('loot');
  if(R.chestOffers)R.chestOffers=R.chestOffers.filter(i=>cands.some(c=>c.i===i));
  if(!R.chestOffers||!R.chestOffers.length){const pool=cands.map(c=>c.i);R.chestOffers=[];while(pool.length&&R.chestOffers.length<3)R.chestOffers.push(pool.splice(Math.floor(rand(pool.length)),1)[0])}
  if(!R.chestOffers.length){R.chestOffers=null;gain(18);endChest('+18 ₿');return}
  const tok=++equipTok,d=modal(L('보물상자 · 장비 선택','Vault · choose gear'),L('하나를 고르세요. 가진 장비는 레벨업, 새 장비는 Lv1로 장착됩니다.','Pick one. Owned gear levels up; new gear is equipped at Lv1.'));
  const st=document.createElement('div');st.className='vertical';d.append(st);
  for(const i of R.chestOffers)equipCard(st,i,()=>{if(tok!==equipTok||!R.chest)return;const c=equipCands('loot').find(x=>x.i===i);if(!c)return;
    const done=drop=>{if(!R.chest||!R.chestOffers)return;if(drop!=null)dropGear(drop);if(!grant(i,'loot'))return;R.chestOffers=null;play('Rare_Reward',.45,.3);endChest(nm(names[i])+' Lv'+R.lv[i])};
    if(c.isNew&&c.full)replaceFlow(i,chestEquip,done);else{equipTok++;done(null)}},'loot');
  button(d,L('설계도 [B]','Blueprints [B]'),guide);stamp()}
/* ===== END 장비 선택·교체 ===== */

desc[0]=['기수 방향 관통 광선','Fixed forward beam'];desc[10]=['기수 방향 관통 작살','Forward piercing harpoon'];desc[28]=['기수 정면에 화염 분사','Forward flame jet'];spec[0]=['화염구 보조포 · 속도 211','Fireball auxiliary · speed 211'];let last=performance.now();function frame(now){let dt=Math.min(.06,(now-last)/1000);last=now;if(mode==='play'){step(dt);if(++tick%8===0)ui()}if(R&&mode!=='home'){draw();drawJoy()}musicSync();mobileSync();requestAnimationFrame(frame)}window.addEventListener('keydown',e=>{if(mode==='play'&&['KeyA','KeyS','KeyD','KeyW','ArrowLeft','ArrowRight','ArrowUp','ArrowDown','KeyP','Escape'].includes(e.code)){e.preventDefault();if(e.code==='KeyP'||e.code==='Escape')pause();else keys.add(e.code)}});window.addEventListener('keyup',e=>keys.delete(e.code));window.addEventListener('blur',()=>{keys.clear();pause()});document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});window.addEventListener('pagehide',()=>{if(['play','pick','pause','guide'].includes(mode))stamp()});home();requestAnimationFrame(frame);
</script></html>
