#mbar,#padzone,#rotate,#fsback,#fsgo,#stick,#mRot{display:none}
#flight>#pause{display:block;margin:6px auto}
body.mobile.flying{overflow:hidden;overscroll-behavior:none}
body.mobile #flight:not([hidden]){position:fixed;inset:0;z-index:5;background:#040a18;display:flex;align-items:center;justify-content:center;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

body.mobile.flying #mbar{display:flex;flex-wrap:wrap;align-content:flex-start;position:fixed;top:max(4px,env(safe-area-inset-top));left:calc(50% + 96px);max-width:calc(50% - 102px);z-index:7;gap:6px;touch-action:none}

body.mobile.flying #mPause{font-weight:bold;border-color:#86eddd99}
body.mobile.flying.needrot #mRot{display:inline-block}
body.mobile.flying #padzone{display:block;position:fixed;right:0;bottom:0;width:calc(min(40vmin,165px) + 70px);height:calc(min(40vmin,165px) + 56px);z-index:6;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}

#padzone:active #pad,#pad:has(span.on){opacity:.95}
#pad span{position:absolute;width:34%;height:34%;display:grid;place-items:center;font-size:min(6vmin,22px);color:#dff8ff;background:#17345666;border:1px solid #7fe6ff66;border-radius:12px}
#pad span.on{background:#5fd8f2;color:#03121f}

body.mobile.flying #stick.on{display:block;position:absolute;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;background:#9fe9ff10;border:2px solid #9fe9ff48;z-index:6;pointer-events:none}
