   const a=await adena.GetAccount();if(!a||a.status!=='success'||!a.data||!a.data.address)throw Error((a&&a.message)||'GET_ACCOUNT_FAILED');
   acct.addr=a.data.address;acct.chain=a.data.chainId||'';acct.state='ok';try{localStorage.setItem('gnome.rift.wallet','adena')}catch{}}
  catch(e){acct.state='error';acct.err=String(e.message||e);acct.addr=''}}

  if(!r||r.status!=='success')throw Error(r&&/REJECT/i.test((r.type||'')+(r.message||''))?'REJECTED':(r&&(r.message||r.type))||'TX_FAILED');return r.data||{}}

   `<div><b>${L('계정 (지갑 · 선택)','Account (wallet · optional)')}</b> <small>${L('플레이에는 필요 없음. 출석·구매·재출격권만 지갑 승인.','Not needed to play. Only attendance, purchases and revives ask the wallet.')}</small><br>`+
   sel('node','내 PC Gno 노드','Gno node on my PC',!PAGE_LOCAL)+sel('onyx','Onyx 테스트넷','Onyx testnet')+(shopNet==='onyx'?`<label>${L('상점 realm','shop realm')} <input id="shoprealm" size="38" placeholder="${L('배포 후 입력 (미배포)','enter after deploy (not deployed)')}" value="${SHOP.onyx.realm}"></label>`:'')+acc+`<div id="gbtns"></div></div>`;
  s.querySelectorAll('input[name=shopnet]').forEach(i=>i.onchange=()=>{shopNet=i.value;try{localStorage.setItem('gnome.rift.shopnet',shopNet)}catch{}shopInfo={};gRender();if(acct.addr)shopRefresh().then(gRender)});
  const ri=$('shoprealm');if(ri)ri.onchange=()=>{const v=ri.value.trim();if(!v||/^gno\.land\/r\/[a-z0-9_\/]+$/.test(v)){SHOP.onyx.realm=v;try{localStorage.setItem('gnome.rift.shoprealm',v)}catch{}shopInfo={};if(acct.addr)shopRefresh().then(gRender);gRender()}else ri.value=SHOP.onyx.realm};
  const b=$('gbtns');

  else{button(b,L('새로고침','Refresh'),async()=>{await shopRefresh();gRender();if(mode==='home')home()});

  const m=document.createElement('small');m.id='gmsg';b.append(m)}

async function reviveUI(err){const tok=++revTok,d=modal(L('기체 신호 소실','Flight signal lost'),L('긴급 재출격권 · G 코인으로 이어하기','Emergency revive · continue with G coins'));
