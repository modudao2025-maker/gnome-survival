const worlds=['지구','화성','토성','해왕성'],worldEN=['Earth','Mars','Saturn','Neptune'];function landscape(ox,oy){let px=ox*.48,py=oy*.48;for(let x=Math.floor((px-320)/870);x<=Math.floor((px+W+180)/870);x++)for(let y=Math.floor((py-220)/570);y<=Math.floor((py+H+150)/570);y++){let k=mod(x+3*y+R.stage,4),X=x*870+173-px,Y=y*570+110-py,rad=[54,47,55,49][k];if(X < -115||X>W+115||Y< -90||Y>H+90)continue;c.save();c.translate(X,Y);c.globalAlpha=.80;let g=c.createRadialGradient(-19,-21,3,10,10,rad*1.1),base=['#337bc4','#c96846','#c3a475','#3866c3'][k];g.addColorStop(0,['#72c9ed','#ec9977','#e2c893','#88aaff'][k]);g.addColorStop(.68,base);g.addColorStop(1,'#10182b');c.fillStyle=g;c.beginPath();c.arc(0,0,rad,0,T);c.fill();c.save();c.clip();if(k===0){c.fillStyle='#649d70';for(let [xx,yy,rx,ry] of [[-25,-14,17,10],[-14,6,10,17],[15,-16,20,8],[10,-2,11,12],[30,18,8,4]]){c.beginPath();c.ellipse(xx,yy,rx,ry,-.3,0,T);c.fill()}c.strokeStyle='#c4e5e788';for(let j=0;j<3;j++){c.beginPath();c.moveTo(-52,-29+j*24);c.bezierCurveTo(-13,-47+j*24,12,-18+j*24,50,-37+j*24);c.stroke()}}else if(k===1){for(let j=0;j<14;j++)dot(Math.sin(j*4.7)*42,Math.cos(j*1.5)*36,3+j%5,'#944d4299')}else{for(let j=0;j<7;j++){c.fillStyle=j%2?'#b5d1ff33':'#473f5e33';c.fillRect(-64,-48+j*14,128,5)}}c.restore();if(k===2){c.strokeStyle='#d4c091aa';c.lineWidth=6;c.beginPath();c.ellipse(0,0,93,15,-.29,0,T);c.stroke()}c.fillStyle='#b2cee6';c.font='10px monospace';c.textAlign='center';c.fillText(P.lang==='ko'?worlds[k]:worldEN[k],0,rad+15);c.restore()}}
